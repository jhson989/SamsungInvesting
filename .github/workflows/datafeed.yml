name: datafeed

# All cron times are UTC. KST = UTC+9.
on:
  schedule:
    - cron: "7,22,37,52 0-6 * * 1-5"  # KST 09:07-15:52, every 15 min: intraday snapshot
    - cron: "5 7 * * 1-5"             # KST 16:05: close + provisional investor flows
    - cron: "35 9 * * 1-5"            # KST 18:35: final investor flows
    - cron: "5 22 * * 1-5"            # KST 07:05 next day: US close (SOX, NVDA, MU, 10Y)
  push:
    paths:
      - "datafeed/**"
      - ".github/workflows/datafeed.yml"
  workflow_dispatch:
    inputs:
      mode:
        description: "intraday | close | flows | us | backfill"
        required: true
        default: "backfill"

permissions:
  contents: write

concurrency:
  group: datafeed
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: datafeed/requirements.txt

      - run: pip install -r datafeed/requirements.txt

      - name: Choose mode
        id: mode
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          INPUT_MODE: ${{ github.event.inputs.mode }}
        run: |
          case "$EVENT" in
            push) MODE=backfill ;;
            workflow_dispatch) MODE="$INPUT_MODE" ;;
            schedule)
              case "$SCHEDULE" in
                "7,22,37,52 0-6 * * 1-5") MODE=intraday ;;
                "5 7 * * 1-5") MODE=close ;;
                "35 9 * * 1-5") MODE=flows ;;
                "5 22 * * 1-5") MODE=us ;;
                *) MODE=intraday ;;
              esac ;;
            *) MODE=intraday ;;
          esac
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "mode=$MODE"

      - name: Collect
        run: python datafeed/collect.py --mode "${{ steps.mode.outputs.mode }}"

      - name: Commit data
        run: |
          git config user.name "datafeed-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "no changes"; exit 0
          fi
          git commit -m "data: ${{ steps.mode.outputs.mode }} $(TZ=Asia/Seoul date +'%Y-%m-%d %H:%M KST')"
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep 5
          done
          exit 1
